name: goreleaser

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: goreleaser-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Add web npm binaries to PATH
        run: echo "$GITHUB_WORKSPACE/web/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Build web assets
        working-directory: web
        run: |
          npm run build --workspace frps
          npm run build --workspace frpc

      - name: Run GoReleaser
        if: startsWith(github.ref, 'refs/tags/v')
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean --release-notes=./Release.md
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build snapshot artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --snapshot --clean --skip=publish --release-notes=./Release.md

      - name: Upload snapshot release assets
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
          CONTINUOUS_TAG: continuous
        run: |
          set -euo pipefail

          git tag -f "$CONTINUOUS_TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$CONTINUOUS_TAG"

          notes="Automated build from ${GITHUB_REF_NAME} at ${GITHUB_SHA}."
          if gh release view "$CONTINUOUS_TAG" >/dev/null 2>&1; then
            gh release edit "$CONTINUOUS_TAG" \
              --title "Continuous build" \
              --notes "$notes" \
              --prerelease \
              --latest=false
          else
            gh release create "$CONTINUOUS_TAG" \
              --title "Continuous build" \
              --notes "$notes" \
              --prerelease \
              --latest=false
          fi

          gh release upload "$CONTINUOUS_TAG" \
            dist/*.tar.gz \
            dist/*.zip \
            dist/*checksums.txt \
            --clobber
