name: goreleaser

on:
  workflow_dispatch:

jobs:
  goreleaser:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/frps/package-lock.json
            web/frpc/package-lock.json

      - name: Install dependencies and build web assets (frps)
        working-directory: web/frps
        run: |
          npm ci
          make build

      - name: Install dependencies and build web assets (frpc)
        working-directory: web/frpc
        run: |
          npm ci
          make build

      - name: Make All
        run: ./package.sh

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean --release-notes=./Release.md
        env:
          GITHUB_TOKEN: ${{ secrets.GPR_TOKEN }}